name: Check

on:
  push:
  pull_request:

jobs:
  format-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - uses: actions/checkout@v6
      - run: deno fmt --check
      - run: deno lint
      - run: deno check
